<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Survey Quiz Result</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
        <link rel="stylesheet" th:href="@{/css/survey/view_result_survey.css}">
</head>
<body class="bg-gradient-to-r from-[#0F3B6F] via-[#1E5AA8] to-[#4C2A85] text-white min-h-screen flex flex-col p-6">

<header class="text-center mb-10">
    <h1 class="text-4xl font-bold tracking-wide text-white drop-shadow-lg">Your Survey Test</h1>
    <p class="text-sm text-indigo-200 mt-2">Review your answers and see how well you did!</p>
</header>

<div id="question" class="space-y-12" th:each="question, iterStat : ${surveyQuestions}">
    <!-- Container theo hàng ngang -->
    <div id="question_list" class="flex items-start gap-6">
        <!-- Khối câu hỏi -->
        <div class="question-block flex-1 bg-white text-gray-800 p-6 rounded-2xl shadow-xl"
             th:attr="data-correct=${question.correctOption}, data-name='q' + ${iterStat.index}">

            <h2 class="text-xl font-bold mb-4 text-indigo-800"
                th:text="${iterStat.index + 1} + '. ' + ${question.questionText}">Question</h2>

            <div class="space-y-3">
                <!-- Option A -->
                <label class="block px-4 py-2 rounded-lg border hover:bg-indigo-50 cursor-pointer transition flex items-center gap-3"
                       th:classappend="${userAnswers[question.getSurveyQuestionId()]?.selectedOption == 'A'} ? 'border-indigo-600 bg-indigo-100'">
                    <input type="radio" th:name="'q' + ${iterStat.index}" value="A"
                           class="form-radio text-indigo-600" disabled
                           th:checked="${userAnswers[question.getSurveyQuestionId()]?.selectedOption == 'A'}"/>
                    <span th:text="'A. ' + ${question.optionA}">Option A</span>
                </label>

                <!-- Option B -->
                <label class="block px-4 py-2 rounded-lg border hover:bg-indigo-50 cursor-pointer transition flex items-center gap-3"
                       th:classappend="${userAnswers[question.getSurveyQuestionId()]?.selectedOption == 'B'} ? 'border-indigo-600 bg-indigo-100'">
                    <input type="radio" th:name="'q' + ${iterStat.index}" value="B"
                           class="form-radio text-indigo-600" disabled
                           th:checked="${userAnswers[question.getSurveyQuestionId()]?.selectedOption == 'B'}"/>
                    <span th:text="'B. ' + ${question.optionB}">Option B</span>
                </label>

                <!-- Option C -->
                <label class="block px-4 py-2 rounded-lg border hover:bg-indigo-50 cursor-pointer transition flex items-center gap-3"
                       th:classappend="${userAnswers[question.getSurveyQuestionId()]?.selectedOption == 'C'} ? 'border-indigo-600 bg-indigo-100'">
                    <input type="radio" th:name="'q' + ${iterStat.index}" value="C"
                           class="form-radio text-indigo-600" disabled
                           th:checked="${userAnswers[question.getSurveyQuestionId()]?.selectedOption == 'C'}"/>
                    <span th:text="'C. ' + ${question.optionC}">Option C</span>
                </label>

                <!-- Option D -->
                <label class="block px-4 py-2 rounded-lg border hover:bg-indigo-50 cursor-pointer transition flex items-center gap-3"
                       th:classappend="${userAnswers[question.getSurveyQuestionId()]?.selectedOption == 'D'} ? 'border-indigo-600 bg-indigo-100'">
                    <input type="radio" th:name="'q' + ${iterStat.index}" value="D"
                           class="form-radio text-indigo-600" disabled
                           th:checked="${userAnswers[question.getSurveyQuestionId()]?.selectedOption == 'D'}"/>
                    <span th:text="'D. ' + ${question.optionD}">Option D</span>
                </label>
            </div>

            <!-- Hiển thị đáp án người dùng đã chọn -->
            <p class="mt-3 text-sm font-semibold"
               th:if="${userAnswers[question.getSurveyQuestionId()] != null}">
                You selected:
                <span class="text-blue-700" th:text="${userAnswers[question.getSurveyQuestionId()].selectedOption}">A</span>
            </p>

            <!-- Hiển thị đáp án đúng -->
            <p class="mt-1 text-sm font-semibold text-green-700">
                Correct answer: <span th:text="${question.correctOption}">A</span>
            </p>

            <!-- Hiển thị đúng/sai -->
            <p class="mt-1 text-sm font-semibold"
               th:if="${userAnswers[question.getSurveyQuestionId()] != null}"
               th:text="${userAnswers[question.getSurveyQuestionId()].correct} ? '✔️ Correct' : '❌ Incorrect'"
               th:classappend="${userAnswers[question.getSurveyQuestionId()].correct} ? 'text-green-600' : 'text-red-600'">
            </p>
        </div>

        <!-- Icon đúng/sai -->
        <div class="mt-2 flex-shrink-0 w-12">
            <!-- Đúng: icon chúc mừng -->
            <img th:if="${userAnswers[question.getSurveyQuestionId()]?.correct}"
                 src="https://cdn.pixabay.com/photo/2016/09/01/08/24/smiley-1635449_1280.png"
                 alt="Correct" class="w-12 h-12">

            <!-- Sai: icon buồn -->
            <img th:if="${userAnswers[question.getSurveyQuestionId()] != null and !userAnswers[question.getSurveyQuestionId()].correct}"
                 src="https://cdn.pixabay.com/photo/2012/04/05/01/06/emoticon-25519_1280.png"
                 alt="Incorrect" class="w-12 h-12">
        </div>
    </div>
</div>


<div class="mt-16 text-center">
    <a href="javascript:history.back()"
       class="inline-flex items-center gap-2 bg-white text-indigo-800 px-6 py-3 rounded-full shadow-lg font-semibold hover:bg-indigo-100 transition duration-300">
        <i class="ph ph-arrow-left text-lg"></i>
        Back to Previous Page
    </a>
</div>
<script th:src="@{/js/survey/view_result_survey.js}"></script>
</body>
</html>
