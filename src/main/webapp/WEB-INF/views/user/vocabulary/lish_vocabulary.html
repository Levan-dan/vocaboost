<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>English Vocabulary</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/user/vocabulary/list-vocabulary.css}">
    <link rel="stylesheet" th:href="@{/css/user/headerAndFooter.css}">
</head>
<body class="bg-gray-100 min-h-screen">
<!-- Gọi Header -->
<header th:include="/user/headerAndFooter :: siteHeader"></header>

<!-- Bọc main trong div căn giữa -->
<div class="flex items-center justify-center min-h-[80vh]">
    <main class="max-w-5xl w-full bg-white rounded-2xl shadow-lg p-6 md:p-8">
        <h1 th:text="${lessonTitle.getTitle()}" class="text-2xl md:text-3xl font-semibold text-indigo-700 mb-8 text-center">
            English Vocabulary
        </h1>

        <section id="vocab-container" class="grid grid-cols-1 md:grid-cols-2 gap-x-10 gap-y-6">
            <article th:each="vocab : ${vocabularies}"
                     class="flex flex-col md:flex-row bg-indigo-50 rounded-xl shadow-md overflow-hidden hover:shadow-lg transition-shadow duration-300">
                <img th:src="${vocab.image}" th:alt="'Image of ' + ${vocab.word}"
                     class="w-full md:w-36 object-cover" width="200" height="200"/>
                <div class="p-4 flex flex-col justify-between">
                    <div>
                        <div class="flex items-center space-x-2 mb-1">
                            <h2 class="text-xl font-bold text-indigo-800 capitalize" th:text="${vocab.word}">Word</h2>
                            <button class="text-indigo-600 hover:text-indigo-900 focus:outline-none"
                                    th:attr="onclick=|playAudio('${vocab.word}')|">
                                <i class="fa-solid fa-volume-up fa-sm"></i>
                            </button>
                        </div>
                        <p class="text-indigo-700 text-sm italic mb-1" th:text="${vocab.transcription}">/example/</p>
                        <p class="text-gray-800 text-sm font-medium mb-1" th:text="${vocab.meaning}">Meaning</p>
                        <p class="text-gray-600 italic text-xs" th:text="'Ví dụ: ' + ${vocab.example}">Example</p>
                    </div>
                </div>
            </article>
        </section>
    </main>
</div>

<!-- Gọi Footer -->
<footer th:include="/user/headerAndFooter :: siteFooter"></footer>

<script th:src="@{/js/user/vocabulary/list_vocabulary.js}">
</script>
<script th:src="@{/js/user/headerAndFooter.js}">
</script>


</body>
</html>
