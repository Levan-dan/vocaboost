<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Survey Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" th:href="@{/css/authenticate/surveyQuestion.css}">
</head>
<body class="bg-gradient-to-r from-[#0F3B6F] via-[#1E5AA8] to-[#4C2A85] text-white min-h-screen flex flex-col">

<div class="max-w-5xl mx-auto p-8 flex-grow">
    <h1 class="text-5xl font-bold text-center mb-10 drop-shadow-lg">🎓 Entrance survey questions</h1>

    <!-- Hiển thị điểm -->
    <div id="score-result"
         class="hidden mt-6 text-center text-2xl font-semibold rounded-lg p-6 transition-all duration-300">
        <!-- JS sẽ thêm nội dung tại đây -->
    </div>

    <form th:action="@{/SurveyQuestion/submitSurvey}"  method="post" onsubmit="submitAnswers(event)">
        <div id="question" class="space-y-8" th:each="question, iterStat : ${surveyQuestions}">
            <div class="question-block bg-white text-gray-800 p-6 rounded-2xl shadow-xl transition hover:shadow-2xl"
                 th:attr="data-correct=${question.correctOption}, data-name='q' + ${iterStat.index}">
                <h2 class="text-xl font-bold mb-4 text-indigo-800"
                    th:text="${iterStat.index + 1} + '. ' + ${question.questionText}">Question</h2>

                <div class="space-y-3">
                    <label class="block px-4 py-2 rounded-lg border hover:bg-indigo-50 cursor-pointer transition flex items-center gap-3">
                        <input type="radio" th:name="'q' + ${iterStat.index}" value="A"
                               class="form-radio text-indigo-600"/>
                        <span th:text="'A. ' + ${question.optionA}">Option A</span>
                    </label>
                    <label class="block px-4 py-2 rounded-lg border hover:bg-indigo-50 cursor-pointer transition flex items-center gap-3">
                        <input type="radio" th:name="'q' + ${iterStat.index}" value="B"
                               class="form-radio text-indigo-600"/>
                        <span th:text="'B. ' + ${question.optionB}">Option B</span>
                    </label>
                    <label class="block px-4 py-2 rounded-lg border hover:bg-indigo-50 cursor-pointer transition flex items-center gap-3">
                        <input type="radio" th:name="'q' + ${iterStat.index}" value="C"
                               class="form-radio text-indigo-600"/>
                        <span th:text="'C. ' + ${question.optionC}">Option C</span>
                    </label>
                    <label class="block px-4 py-2 rounded-lg border hover:bg-indigo-50 cursor-pointer transition flex items-center gap-3">
                        <input type="radio" th:name="'q' + ${iterStat.index}" value="D"
                               class="form-radio text-indigo-600"/>
                        <span th:text="'D. ' + ${question.optionD}">Option D</span>
                    </label>
                </div>

                <!-- Kết quả đúng: Ẩn ban đầu -->
                <p class="correct-answer mt-4 text-sm text-green-700 font-medium hidden">
                    The correct answer is:
                    <span th:text="${question.correctOption}">A</span>
                </p>
            </div>
        </div>

        <div id="submit_survey" class="mt-10 text-center">
            <button type="submit"
                    class="bg-yellow-400 hover:bg-yellow-500 text-black font-semibold px-10 py-4 rounded-full shadow-lg transition transform hover:scale-105 text-lg">
                Submit survey assignment 🎯
            </button>
        </div>
    </form>

</div>

<!-- Script xử lý quiz -->
<script th:src="@{/js/authenticate/surveyQuestion.js}">
</script>
</body>
</html>
