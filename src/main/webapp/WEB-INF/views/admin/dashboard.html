<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/admin/homeUser.css}">
    <link rel="stylesheet" th:href="@{/css/user/headerAndFooter.css}">
</head>
<body class="bg-white font-sans">
<!-- Gọi Header -->
<header th:include="/user/headerAndFooter :: siteHeader"></header>
<div style="width: 70%" class="max-w-4xl mx-auto p-4">
    <header class="text-center mb-6">
        <h1 class="text-[18px] font-bold text-[#7f1d1d] leading-tight">
            Learn English speaking FREE with VocaBoost.com
        </h1>
        <p class="text-[12px] text-black mt-1">
            Our goal is to help you
            <span class="font-bold">
                Learn English
            </span>
            better so you can
            <span class="font-semibold italic">
                speak English
            </span>
            fluently.
        </p>
        <p class="text-[12px] text-black mt-1">
            Improve your
            <span class="font-bold italic">
                English communication
            </span>
            for free!
        </p>
    </header>

    <h2 class="text-[12px] font-extrabold text-black mb-3">
        ENGLISH LESSONS MANAGEMENT
    </h2>

    <hr class="border-t border-blue-300 mb-6"/>

    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-6 space-y-3 sm:space-y-0">
        <div class="relative w-full sm:w-72">
            <input class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm" id="searchInput" placeholder="Search lessons by name..." type="text"/>
            <span class="absolute left-3 top-2.5 text-gray-400">
       <i class="fas fa-search">
       </i>
      </span>
        </div>
        <button class="inline-flex items-center bg-red-700 hover:bg-red-800 text-white text-sm font-semibold px-4 py-2 rounded-md shadow transition" id="addLessonBtn" type="button">
            <i class="fas fa-plus mr-2">
            </i>
            Add Lesson
        </button>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
        <div th:each="subject, start : ${subject}" th:style="'background: ' + ${subject.getBackground_color()}" class="flex space-x-4 items-start bg-gradient-to-r from-red-100 via-red-50 to-red-100 rounded-lg p-4 shadow-md hover:shadow-lg transition-shadow cursor-pointer relative">
            <img th:src="'/images/subject/' + ${subject.getImage()}" alt="Red apple on a wooden desk representing English Speaking Basics" class="w-[50px] h-[50px] object-cover flex-shrink-0 rounded-md shadow" height="50"  width="50"/>
            <div class="flex-1">
                <h3 th:text="${subject.getName()}"  class="text-[13px] font-bold text-blue-700 mb-1 hover:underline">
                    English Speaking Basics
                </h3>
                <p th:text="${subject.getDescription()}" class="text-[11px] text-red-900 leading-tight">
                    Basics of English Speaking for beginners using common expressions.
                </p>
            </div>
            <div class="flex flex-col space-y-2 ml-4">
                <button aria-label="Edit English Speaking Basics" class="text-red-700 hover:text-red-900 text-sm" type="button">
                    <i class="fas fa-edit">
                    </i>
                </button>
                <button aria-label="Delete English Speaking Basics" class="text-red-700 hover:text-red-900 text-sm" type="button">
                    <i class="fas fa-trash-alt">
                    </i>
                </button>
            </div>
        </div>
    </div>


</div>
<!-- Gọi Footer -->
<footer th:include="/user/headerAndFooter :: siteFooter"></footer>
</body>
</html>
