<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Vocaboost Header and Footer</title>
</head>
<body>
<div th:fragment="siteHeaderAdmin">
    <header id="headerOfWeb" class="flex justify-between items-center px-4 py-3 bg-white shadow-md">
        <div class="header-left flex items-center space-x-6">
            <div class="logo_header flex items-center space-x-2 focus:outline-none" tabindex="0"
                 aria-label="Vocaboost logo">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/40/VB.NET_Logo.svg/1200px-VB.NET_Logo.svg.png"
                     alt="Vocaboost logo with VB.NET style icon" class="h-10 w-auto"/>
                <span class="site-name text-2xl font-bold text-gray-900 select-none">VOCABOOST</span>
            </div>
            <nav id="list_lesson_header" class="flex space-x-6 text-gray-700 font-medium text-lg"
                 aria-label="Primary navigation">
                <a  th:href="@{/admin/dashboard}" tabindex="3" class="hover:text-blue-600 focus:outline-none focus:text-blue-600">
                    <i class="fas fa-tachometer-alt w-5"></i>
                    <span class="ml-3 font-medium">Dashboard</span>
                </a>
                <a href="#grammars" tabindex="2" class="hover:text-blue-600 focus:outline-none focus:text-blue-600">
                    <i class="fas fa-users w-5"></i>
                    <span class="ml-3 font-medium">Users</span>
                </a>
                <a href="#specialized" tabindex="3" class="hover:text-blue-600 focus:outline-none focus:text-blue-600">
                    <i class="fas fa-chart-bar w-5"></i>
                    <span class="ml-3 font-medium">Reports</span>
                </a>

            </nav>
        </div>
        <div class="header-right relative flex items-center space-x-3" role="navigation" aria-label="User menu">
            <button class="icon_button_header p-1.5 rounded-md hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    aria-label="Settings" tabindex="4" title="Settings" type="button">
                <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" height="28px" width="28px"
                     viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M19.14 12.936a6.978 6.978 0 0 0 .048-1.248 6.978 6.978 0 0 0-.048-1.248l2.034-1.577a.5.5 0 0 0 .12-.637l-1.922-3.32a.5.5 0 0 0-.604-.223l-2.394.96a6.997 6.997 0 0 0-2.16-1.248l-.36-2.532a.5.5 0 0 0-.496-.424h-3.844a.5.5 0 0 0-.496.424l-.36 2.532a6.997 6.997 0 0 0-2.16 1.248l-2.394-.96a.5.5 0 0 0-.604.224l-1.922 3.32a.5.5 0 0 0 .12.638l2.034 1.577a6.978 6.978 0 0 0-.048 1.248 6.978 6.978 0 0 0 .048 1.248l-2.034 1.577a.5.5 0 0 0-.12.637l1.922 3.32a.5.5 0 0 0 .604.223l2.394-.96a6.997 6.997 0 0 0 2.16 1.248l.36 2.532a.5.5 0 0 0 .496.424h3.844a.5.5 0 0 0 .496-.424l.36-2.532a6.997 6.997 0 0 0 2.16-1.248l2.394.96a.5.5 0 0 0 .604-.223l1.922-3.32a.5.5 0 0 0-.12-.637l-2.034-1.577zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/>
                </svg>
            </button>
            <div class="relative">
                <button id="userMenuButton"
                        class="icon_button_header p-1.5 rounded-md hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        aria-label="User profile" tabindex="5" title="User profile" type="button" aria-haspopup="true"
                        aria-expanded="false">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" height="28px" width="28px"
                         viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5zm0 2c-3.33 0-10 1.67-10 5v3h20v-3c0-3.33-6.67-5-10-5z"/>
                    </svg>
                </button>

                <!--                dropdown-->
                <div id="userDropdown"
                     class="hidden absolute right-0 mt-2 w-48 bg-white border border-gray-200 rounded-md shadow-lg z-20"
                     role="menu" aria-label="User profile dropdown">
                    <a id="userInfoBtn" style="border-radius: 5px 5px 0px 0px; color: black" href="#user-info"
                       tabindex="6"
                       class="block px-4 py-2 text-black-700 hover:bg-blue-100 focus:bg-blue-100 focus:outline-none"
                       role="menuitem">User Information</a>
                    <a id="logoutLink" style="border-radius: 0px 0px 5px 5px; color: black" href="#logout" tabindex="7"
                       class="block px-4 py-2 text-black-700 hover:bg-blue-100 focus:bg-blue-100 focus:outline-none"
                       role="menuitem">Log out</a>
                </div>
            </div>
        </div>
    </header>


    <!-- Modal backdrop -->
    <div id="logoutModalBackdrop" class="hidden fixed inset-0 bg-black bg-opacity-50 z-30"></div>
    <!-- Modal -->
    <div id="logoutModal" class="hidden fixed inset-0 flex items-center justify-center z-40 px-4">
        <div class="bg-white rounded-lg shadow-lg max-w-sm w-full p-6">
            <h2 class="text-xl font-semibold text-gray-900 mb-4"><i class="fas fa-sign-out-alt mr-2 text-red-600"></i>Confirm
                Logout</h2>
            <p class="text-gray-700 mb-6">Do you want to log out?</p>
            <div class="flex justify-end space-x-4">
                <button id="cancelLogoutBtn"
                        class="px-4 py-2 rounded-md bg-gray-200 hover:bg-gray-300 focus:outline-none focus:ring-0 focus:ring-gray-400">
                    Cancel
                </button>
                <button id="confirmLogoutBtn"
                        class="px-4 py-2 rounded-md bg-red-600 text-white hover:bg-red-700 focus:outline-none focus:ring-0 focus:ring-red-500">
                    Log out
                </button>
            </div>
        </div>
    </div>


    <!-- Modal backdrop -->
    <div id="userInfoModal"
         class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50 hidden"
         aria-hidden="true">
        <!-- Modal container -->
        <div class="w-full max-w-sm rounded-lg shadow-lg bg-white overflow-hidden relative"
             role="dialog"
             aria-modal="true"
             aria-labelledby="modalTitle">
            <!-- Header -->
            <div class="flex items-center justify-between px-5 py-3 border-b border-gray-200">
                <h2 id="modalTitle"
                    class="font-semibold text-gray-900 text-lg">
                    Account information
                </h2>
                <button id="closeModalBtn"
                        aria-label="Close"
                        class="text-gray-500 hover:text-gray-700 focus:outline-none">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <!-- Banner Image -->
            <img alt="Banner image of a young man wearing glasses and cap in an indoor setting with colorful background"
                 class="w-full h-36 object-cover"
                 draggable="false"
                 height="144"
                 src="https://inkythuatso.com/uploads/thumbnails/800/2022/03/hinh-anh-la-co-viet-nam-4-24-16-25-57.jpg"
                 width="400"/>
            <!-- Profile section -->
            <div class="flex items-center px-5 py-4 -mt-12">
                <div class="relative">
                    <img id="avatarImage"
                         alt="Profile photo of a young man taking a mirror selfie wearing black t-shirt"
                         class="w-20 h-20 rounded-full border-4 border-white object-cover shadow-md"
                         draggable="false"
                         height="80"
                         th:src="@{'/images/avatar/' + ${currentUser.avatarPath}}"
                         width="80"/>
                    <!-- Label for file input to update avatar -->
                    <label for="avatarInput"
                           aria-label="Change profile photo"
                           class="absolute bottom-0 right-0 bg-white rounded-full p-2 border border-gray-300 hover:bg-gray-100 focus:outline-none shadow cursor-pointer"
                           title="Cập nhật ảnh đại diện">
                        <i class="fas fa-camera text-gray-600 text-lg"></i>
                    </label>
                    <input style="display: none" type="file"
                           id="avatarInput"
                           accept="image/*"
                           aria-hidden="true"/>
                </div>
                <div style="display: flex; margin-top: 30px">
                    <p th:text="${currentUser.username}" style="margin-right: 10px" class="ml-5 text-gray-900 font-semibold text-xl flex items-center gap-2">
                        your name
                    </p>
                    <i class="fas fa-pencil-alt text-gray-600 text-base cursor-pointer hover:text-gray-800"></i>
                </div>

            </div>
            <!-- Personal info -->
            <div class="px-5 pb-6">
                <p class="font-semibold text-gray-900 text-base mb-4 border-b border-gray-200 pb-2">
                    Personal information
                </p>
                <dl class="grid grid-cols-3 gap-y-3 text-sm text-gray-700">
                    <dt class="font-medium col-span-1">Level</dt>
                    <dd class="col-span-2">
                        <span th:if="${currentUser.role == 'user'}" th:text="${currentUser.level}"></span>
                        <span th:if="${currentUser.role == 'admin'}">You are the administrator</span>
                    </dd>
                    <dt class="font-medium col-span-1">Email</dt>
                    <dd th:text="${currentUser.email}" class="col-span-2"></dd>
                    <dt class="font-medium col-span-1">Number phone</dt>
                    <dd th:text="${currentUser.phoneNumber}" class="col-span-2">+84 328 640 157</dd>
                </dl>
                <p style="text-align: center" class="mt-3 text-xs text-gray-500 leading-tight">
                    Make your credentials stand out by studying hard.
                </p>
            </div>
            <!-- Save button -->
            <div class="px-5 pb-5">
                <button id="saveBtn"
                        class="w-full flex items-center justify-center gap-2 border border-gray-700 rounded-md py-2 text-gray-400 font-semibold text-sm cursor-not-allowed select-none"
                        type="button"
                        disabled>
                    <i class="fas fa-save text-lg"></i> Save
                </button>
            </div>
        </div>
    </div>
</div>
</body>
</html>
