<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>Sửa Thông Tin Bài Học</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/admin/subject/editSubject.css}">
    <link rel="stylesheet" th:href="@{/css/user/headerAndFooter.css}">

</head>
<body>
<!-- Include Header -->
<header th:include="/admin/header :: siteHeaderAdmin"></header>

<h3 id="titleEdit" 3 class="text-4xl lg:text-5xl font-extrabold text-slate-900 mb-14 text-center flex items-center justify-center gap-4 select-none tracking-tight">
    <i class="fas fa-edit text-blue-500 animate-pulse text-4xl drop-shadow-md"></i>
    <span>Edit Lesson Information</span>
</h3>

<!-- Center the form in the screen -->
<div class="flex justify-center px-4">

    <form th:action="@{/admin/editSubject}" th:object="${subjectEdit}"
          method="post"
          enctype="multipart/form-data"
          class="mx-auto w-full max-w-6xl grid grid-cols-1 lg:grid-cols-2 gap-12 bg-white rounded-3xl p-10 shadow-xl"          novalidate>

        <!-- Left Column -->
        <div class="space-y-8 ">
            <!-- Lesson Name -->
            <div class="flex flex-col">
                <label for="name" class="text-lg font-semibold text-slate-700 mb-2">Lesson Name</label>
                <input type="hidden" th:field="*{idSubjects}" />
                <input th:field="*{name}" type="text" id="name" placeholder="e.g. GRAMMAR"
                       class="px-5 py-3 border border-gray-300 rounded-xl shadow-sm focus:ring-2 focus:ring-blue-400 text-base placeholder:text-slate-400"
                       required autocomplete="off" spellcheck="false"/>
                <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-red-600 text-sm mt-1"></p>
            </div>

            <!-- Background Color -->
            <div class="flex flex-col">
                <label for="backgroundColor" class="text-lg font-semibold text-slate-700 mb-2">Background Color</label>
                <input th:field="*{background_color}" type="text" id="backgroundColor"
                       placeholder="e.g. #f87171 or linear-gradient(...)"
                       class="px-5 py-3 border border-gray-300 rounded-xl shadow-sm focus:ring-2 focus:ring-blue-400 text-base placeholder:text-slate-400"
                       autocomplete="off" spellcheck="false"/>
                <div id="colorPreview"
                     class="mt-4 w-full h-16 rounded-xl border border-gray-300 shadow-inner"
                     aria-live="polite" aria-atomic="true" role="region"
                     title="Background color preview"></div>
            </div>

            <!-- Description -->
            <div class="flex flex-col">
                <label for="descriptionSubject" class="text-lg font-semibold text-slate-700 mb-2">Description</label>
                <textarea th:field="*{description}" id="descriptionSubject"
                          rows="6"
                          placeholder="Enter lesson description..."
                          class="px-5 py-4 border border-gray-300 rounded-xl shadow-sm focus:ring-2 focus:ring-blue-400 text-base placeholder:text-slate-400 resize-y"
                          required spellcheck="false"></textarea>
            </div>
        </div>

        <!-- Middle Column -->
        <div   class="lg:col-span-1 flex flex-col justify-start space-y-8 ">
            <!-- Lesson Image -->
            <div class="flex flex-col">
                <label for="imageUpload" class="text-lg font-semibold text-slate-700 mb-2">Lesson Image</label>
                <input type="file" id="imageUpload" name="imageSubjectUpload"
                       th:value="${subjectEdit.image}"
                       accept="image/*"
                       class="block w-full text-base text-gray-600
                              file:mr-4 file:py-2 file:px-4
                              file:rounded-xl file:border-0
                              file:bg-blue-100 file:text-blue-700
                              hover:file:bg-blue-200 cursor-pointer
                              focus:outline-none focus:ring-2 focus:ring-blue-400 transition"/>
                <input type="hidden" name="oldImage" th:value="${subjectEdit.image}" />

                <div id="previewContainer"
                     class="mt-6 max-w-md rounded-xl border border-gray-300 bg-gray-50 p-4 shadow-inner">
                    <img th:src="@{'/images/subject/' + ${subjectEdit.image}}"
                         id="previewImage"
                         alt="Lesson thumbnail"
                         class="w-full h-60 object-cover rounded-lg border border-gray-200 shadow"/>
                    <p class="mt-2 text-sm text-gray-600 text-center">
                        Current image: <span th:text="${subjectEdit.image}"></span>
                    </p>
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="col-span-full flex flex-col sm:flex-row justify-center gap-15 mt-12">
            <button id="editButton" type="submit"
                    class="flex items-center justify-center gap-3 bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white font-bold px-10 py-4 rounded-2xl shadow-lg transition duration-300 transform hover:-translate-y-1">
                <i class="fas fa-save text-lg"></i> Save Changes
            </button>

            <a href="/admin/subject"
               class="flex items-center justify-center gap-3 bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold px-10 py-4 rounded-2xl shadow-lg transition duration-300 transform hover:-translate-y-1">
                <i class="fas fa-times text-lg"></i> Cancel
            </a>
        </div>
    </form>
</div>



<script th:src="@{/js/admin/subject/editSubject.js}">
</script>
<script th:src="@{/js/user/headerAndFooter.js}">
</script>

<!-- Gọi Footer -->
<footer th:include="/user/headerAndFooter :: siteFooter"></footer>
</body>
</html>
