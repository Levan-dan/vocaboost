<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Thêm Môn Học Mới</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/user/headerAndFooter.css}">
    <link rel="stylesheet" th:href="@{/css/admin/dashboard.css}">
    <style>

    </style>
</head>
<body>
<!-- Gọi Header -->
<header th:include="/user/headerAndFooter :: siteHeader"></header>
<div id="formAdd" class="max-w-3xl mx-auto p-10 bg-white rounded-3xl shadow-2xl mt-16 mb-16">
    <h2 class="text-3xl font-extrabold text-gray-900 mb-10 text-center flex items-center justify-center gap-3">
        <i class="fas fa-book-open text-blue-600"></i>
        <span>Add New Lesson</span>
    </h2>

    <form th:action="@{/admin/addSubject}" th:object="${subject}" method="post" action="/subjects/add" class="space-y-8" enctype="multipart/form-data" novalidate>

        <!-- Name -->
        <div>
            <label for="name" class="block text-sm font-semibold text-gray-700 mb-2">Lesson Name</label>
            <input th:field="*{name}" type="text" id="name" placeholder="Enter subject name"
                   class="w-full px-5 py-3 border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent transition"
                   required autocomplete="off" />
            <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-red-500 text-sm mt-1"></p>
        </div>

        <!-- Description -->
        <div>
            <label for="description" class="block text-sm font-semibold text-gray-700 mb-2">Description</label>
            <textarea th:field="*{description}" id="description" placeholder="Enter detailed description"
                      rows="4"
                      class="w-full px-5 py-3 border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent transition"
                      required></textarea>
        </div>

        <!-- Image Upload -->
        <div>
            <label for="imageUpload" class="block text-sm font-semibold text-gray-700 mb-2">Lesson Image</label>
            <div class="flex items-center space-x-4">
                <input type="file" id="imageUpload" name="imageSubjectUpload" accept="image/*"
                       class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4
                              file:rounded-xl file:border-0
                              file:text-sm file:font-semibold
                              file:bg-blue-100 file:text-blue-700
                              hover:file:bg-blue-200
                              cursor-pointer
                              focus:outline-none focus:ring-2 focus:ring-blue-400 focus:ring-offset-1"
                       required />
            </div>
            <p class="mt-2 text-xs text-gray-400">Choose an illustration image for the lesson (jpg, png, gif)</p>
            <div id="previewContainer" class="mt-4 hidden">
                <p class="text-sm font-semibold text-gray-900 mb-1">Preview selected image:</p>
                <img id="previewImage" src="" alt="Selected subject illustration image" class="w-48 h-32 object-cover rounded-lg shadow-md border border-gray-200" />
            </div>
        </div>

        <!-- Background Color -->
        <div>
            <label for="backgroundColor" class="block text-sm font-semibold text-gray-700 mb-2">Background Color</label>
            <input th:field="*{background_color}" type="text" id="backgroundColor" placeholder="#f87171 or linear-gradient(to right, #f87171, #fb923c)"
                   class="w-full px-5 py-3 border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent transition"
                   required autocomplete="off" />
            <div id="colorPreview" class="mt-4 w-32 h-12 rounded-xl border border-gray-300 shadow-inner"></div>
        </div>

        <div class="text-center flex items-center justify-center gap-10">
            <!-- Add Lesson button -->
            <button type="submit"
                    class="inline-flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold px-8 py-3 rounded-xl shadow-lg transition duration-300 focus:outline-none focus:ring-4 focus:ring-blue-300">
                <i class="fas fa-plus"></i> Add Lesson
            </button>

            <!-- Cancel button -->
            <a href="/admin/dashboard"
            class="inline-flex items-center justify-center gap-2 bg-gray-300 hover:bg-gray-400 text-gray-800 font-semibold px-8 py-3 rounded-xl shadow-lg transition duration-300 focus:outline-none focus:ring-4 focus:ring-gray-300">
            <i class="fas fa-times"></i> Cancel
            </a>
        </div>

    </form>
</div>


<script th:src="@{/js/admin/subject/addSubjectForm.js}">
</script>
<!-- Gọi Footer -->
<footer th:include="/user/headerAndFooter :: siteFooter"></footer>
</body>
</html>
